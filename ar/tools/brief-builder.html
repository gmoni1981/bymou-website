<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="أنشئ موجزًا واضحًا لمشروعك الإبداعي في المتصفح."><title>Brief Builder · BYMOU</title><link rel="stylesheet" href="/tools/tools.css"><script src="/tools/brief-builder.js" defer></script><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://bymou.space/ar/tools/brief-builder.html"><link rel="alternate" hreflang="en" href="https://bymou.space/en/tools/brief-builder.html"><link rel="alternate" hreflang="fr" href="https://bymou.space/fr/tools/brief-builder.html"><link rel="alternate" hreflang="it" href="https://bymou.space/it/tools/brief-builder.html"><link rel="alternate" hreflang="ar" href="https://bymou.space/ar/tools/brief-builder.html"><link rel="alternate" hreflang="x-default" href="https://bymou.space/en/tools/brief-builder.html"><link rel="stylesheet" href="/localization.css"><script src="/localization.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="/ar/#work" aria-label="BYMOU، العودة إلى الأعمال">bymou <small>CREATIVE DIRECTION</small></a><a class="back" href="/ar/#work">Back to work ↗</a></header><main class="shell"><section class="intro"><p class="eyebrow">A local creative tool · 02</p><h1>Brief<br>Builder</h1><p>اجمع أساسيات المشروع في موجز موجز يسهل مشاركته. انسخ الملخص أو نزّل ملف JSON المنظم. لا تُرسل أي بيانات ولا تُخزّن.</p></section><div class="layout"><section class="panel" aria-labelledby="brief-title"><h2 id="brief-title">Project essentials</h2><label class="field"><span>Project title</span><input id="project-title" type="text" maxlength="100" placeholder="مثال: إطلاق الربيع"></label><label class="field"><span>Discipline</span><select id="discipline"><option>عقارات</option><option>مواقع إلكترونية</option><option>حملات</option><option>إعادة بناء الهوية</option><option>Interior &amp; 3D</option><option>Ads &amp; film</option><option>أتمتة</option><option>تطبيقات</option></select></label><label class="field"><span>Audience</span><textarea id="audience" maxlength="500" rows="2" placeholder="لمن هذا المشروع؟"></textarea></label><label class="field"><span>Objective</span><textarea id="objective" maxlength="700" rows="3" placeholder="ما الهدف الذي يُراد للمشروع تحقيقه؟"></textarea></label><label class="field"><span>Formats and deliverables</span><textarea id="formats" maxlength="500" rows="2" placeholder="ما الذي ينبغي إنجازه؟"></textarea></label><div class="split"><label class="field"><span>Timing</span><input id="timing" type="text" maxlength="100" placeholder="التواريخ أو المراحل المستهدفة"></label><label class="field"><span>Budget</span><input id="budget" type="text" maxlength="100" placeholder="نطاق أو يُحدد لاحقًا"></label></div><div class="actions"><button class="button" id="copy-summary" type="button">Copy summary</button><button class="button secondary" id="download-json" type="button">Download JSON</button></div><p class="status" id="status" role="status" aria-live="polite"></p></section><section class="panel" aria-labelledby="summary-title"><h2 id="summary-title">Live summary</h2><div class="summary" id="summary" aria-live="polite"></div><p class="hint">Complete what you know. Open questions can stay open.</p></section></div></main></body></html>
