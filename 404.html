<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found · BYMOU</title>
  <meta name="description" content="The page you are looking for doesn't exist or has moved. Return to BYMOU.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2f0e9">
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="https://use.typekit.net/why1lhi.css">
  <style>
    :root {
      --bg: #f2f0e9;
      --ink: #111111;
      --muted: #666666;
      --border: rgba(17, 17, 17, 0.12);
      --vermilion: #d34e2c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .wordmark {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 26px;
      text-decoration: none;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .wordmark span {
      font-style: italic;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 500;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(48px, 10vw, 96px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    h1 em {
      font-style: italic;
    }
    p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
      max-width: 440px;
      margin-bottom: 36px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ink);
      color: var(--bg);
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .cta:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    footer {
      padding: 24px 32px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <a class="wordmark" href="/" aria-label="BYMOU home">by<span>mou</span></a>
    <span class="eyebrow" style="margin:0;">Error 404</span>
  </header>
  <main>
    <p class="eyebrow">00 / The frame is empty</p>
    <h1>Reality is <em>elsewhere.</em></h1>
    <p>The page you are looking for doesn’t exist, has moved, or is still waiting to be imagined.</p>
    <a class="cta" href="/">Return to BYMOU ↗</a>
  </main>
  <footer>
    <span>© 2026 BYMOU · Mounia El · Marrakech · Working worldwide</span>
  </footer>
</body>
</html>
